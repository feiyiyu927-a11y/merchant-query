<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f6f8;color:#1a1a1a;min-height:100vh}
.header{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.08);position:sticky;top:0;z-index:10}
.header-inner{max-width:720px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.logo{width:32px;height:32px;border-radius:8px;background:#2563f4;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.title{font-size:15px;font-weight:600}
.subtitle{font-size:12px;color:#8c8c8c;margin-top:1px}
.badge{margin-left:auto;background:#fff3cd;color:#856404;font-size:11px;padding:3px 8px;border-radius:12px;white-space:nowrap;border:1px solid #ffc107}
.main{max-width:720px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.06);margin-bottom:12px}
.search-hint{font-size:13px;color:#595959;margin-bottom:14px}
/* 两行输入框 */
.input-row{margin-bottom:10px}
.input-label{font-size:12px;color:#8c8c8c;margin-bottom:5px;font-weight:500}
input{width:100%;border:1.5px solid #dde1e9;border-radius:8px;padding:10px 14px;font-size:14px;outline:none;transition:border .2s,box-shadow .2s;font-family:inherit}
input:focus{border-color:#2563f4;box-shadow:0 0 0 3px rgba(37,99,244,.1)}
.input-divider{text-align:center;margin:4px 0 10px;position:relative}
.input-divider::before{content:'';position:absolute;top:50%;left:0;right:0;height:1px;background:#eee}
.input-divider span{position:relative;background:#fff;padding:0 10px;font-size:12px;color:#bfbfbf}
.search-btn{width:100%;background:#2563f4;color:#fff;border:none;border-radius:8px;padding:12px;font-size:15px;font-weight:500;cursor:pointer;margin-top:12px;transition:background .15s,transform .1s;font-family:inherit;letter-spacing:2px}
.search-btn:hover{background:#1d4fd8}
.search-btn:active{transform:scale(0.98)}
.error{margin-top:10px;font-size:13px;color:#ef4444;display:flex;align-items:center;gap:4px}
/* 多结果列表 */
.name-results{margin-top:10px;border:1.5px solid #dde1e9;border-radius:8px;overflow:hidden;max-height:240px;overflow-y:auto}
.name-result-item{padding:10px 14px;cursor:pointer;border-bottom:1px solid #f0f2f4;transition:background .1s;display:flex;justify-content:space-between;align-items:center}
.name-result-item:last-child{border-bottom:none}
.name-result-item:hover{background:#f5f7ff}
.nm{font-size:14px;color:#1a1a1a}.sid{font-size:12px;color:#8c8c8c}
.results-hint{padding:8px 14px;font-size:12px;color:#8c8c8c;background:#fafafa;border-bottom:1px solid #f0f2f4}
/* 结果卡片 */
.merchant-card{border-top:3px solid #2563f4}
.merchant-name{font-size:16px;font-weight:700}
.merchant-id{font-size:12px;color:#8c8c8c;margin-top:4px}
.metrics-title{font-size:13px;font-weight:600;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.data-tag{font-size:11px;color:#8c8c8c;font-weight:400;background:#f0f2f4;padding:2px 8px;border-radius:10px}
.metric-item{margin-bottom:20px}.metric-item:last-child{margin-bottom:0}
.metric-sum{background:rgba(37,99,244,.04);border:1px solid rgba(37,99,244,.15);border-radius:8px;padding:12px 14px;margin-bottom:0}
.metric-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.metric-label{font-size:14px;font-weight:500}
.metric-sum .metric-label{color:#2563f4;font-weight:600}
.metric-value{font-size:14px;font-weight:700}
.metric-target{font-size:12px;color:#8c8c8c;font-weight:400}
.no-check{background:#f3f4f6;color:#6b7280;font-size:12px;padding:3px 10px;border-radius:12px;border:1px solid #e5e7eb}
.progress-track{height:8px;background:#f0f2f4;border-radius:99px;overflow:hidden;margin-bottom:6px}
.progress-bar{height:100%;border-radius:99px;transition:width .5s ease}
.bar-green{background:#22c55e}.bar-blue{background:#2563f4}.bar-orange{background:#f97316}.bar-red{background:#ef4444}
.metric-footer{display:flex;justify-content:space-between;font-size:12px;color:#8c8c8c}
.done{color:#16a34a;font-weight:500}
.divider{height:1px;background:#f0f2f4;margin:16px 0}
.tip{background:rgba(37,99,244,.05);border-radius:8px;padding:10px 14px;font-size:12px;color:#595959}
.empty{text-align:center;padding:48px 16px;color:#8c8c8c}
.empty-icon{opacity:.25;margin-bottom:12px}
</style>

})();
</script>

function search(){
  clearError();
  const sid = document.getElementById('sellerId').value.trim();
  const kw  = document.getElementById('nickName').value.trim();
  document.getElementById('nameResults').style.display = 'none';

  // 优先卖家ID精准查
  if(sid){
    const m = MERCHANT_DATA[sid];
    if(!m){ showError(`未找到卖家ID「${sid}」，请确认是否正确`); return; }
    renderResult(sid, m); return;
  }
  // 昵称模糊搜索
  if(kw){
    const matches = [];
    for(const [id, m] of Object.entries(MERCHANT_DATA)){
      if(m.n && m.n.includes(kw)){ matches.push({id, name:m.n}); if(matches.length>=20) break; }
    }
    if(!matches.length){ showError(`未找到包含「${kw}」的商家，请尝试更短的关键词`); return; }
    if(matches.length===1){ renderResult(matches[0].id, MERCHANT_DATA[matches[0].id]); return; }
    // 多结果 → 列表选择
    let html=`<div class="results-hint">找到 ${matches.length} 个商家，请点击选择：</div>`;
    matches.forEach(r=>{
      html+=`<div class="name-result-item" onclick="pick('${r.id}')"><span class="nm">${r.name}</span><span class="sid">ID: ${r.id}</span></div>`;
    });
    const box=document.getElementById('nameResults');
    box.innerHTML=html; box.style.display='';
    return;
  }
  showError('请填写商家昵称或卖家ID');
}

function pick(sid){
  document.getElementById('nameResults').style.display='none';
  document.getElementById('nickName').value = MERCHANT_DATA[sid].n;
  document.getElementById('sellerId').value = '';
  renderResult(sid, MERCHANT_DATA[sid]);
}

function renderResult(sid,m){
  const metrics=[
    renderMetric('勤奋度（真人推流时长）','小时',m.ts,m.as,m.rs,false),
    '<div class="divider"></div>',
    renderMetric('原创挂车短视频发布数','条',m.tc,m.ac,m.rc,false),
    renderMetric('原创非挂车短视频发布数','条',m.tn,m.an,m.rn,false),
    renderMetric('📊 原创短视频发布数之和','条',m.tv,m.av,m.rv,true),
    '<div class="divider"></div>',
    renderMetric('商业化投流天数','天',m.ta,m.aa,m.ra,false),
  ].join('');
  document.getElementById('result').innerHTML=`
    <div class="card merchant-card">
      <div class="merchant-name">${m.n}</div>
      <div class="merchant-id">卖家ID：${sid}</div>
    </div>
    <div class="card">
      <div class="metrics-title">考核期达标进度<span class="data-tag">实际截至 9.04-9.07</span></div>
      ${metrics}
    </div>
    <div class="tip">💡 实际数据截至 9.04-9.07，考核期为 9.04-9.16。视频之和为挂车+非挂车总数，负值/绿色表示已超额完成。</div>`;
}

function fmtNum(v){if(v===null||v===undefined||v==='')return'-';const n=typeof v==='string'?parseFloat(v):v;if(isNaN(n))return'-';return Math.abs(n)%1===0?String(n):n.toFixed(1);}
function pct(a,t){if(t===null||t<=0||a===null)return 0;return Math.round((a/t)*1000)/10;}
function barCls(p){return p>=100?'bar-green':p>=60?'bar-blue':p>=30?'bar-orange':'bar-red';}
function valColor(p){return p>=100?'color:#16a34a':p>=60?'color:#2563f4':'color:#1a1a1a';}
function renderMetric(label,unit,target,actual,remaining,isSum){
  const tgt=target==='-'||target===null?null:parseFloat(target);
  const act=actual===null||actual===undefined?0:parseFloat(actual);
  const cls='metric-item'+(isSum?' metric-sum':'');
  if(tgt===null||isNaN(tgt))return`<div class="${cls}"><div class="metric-header"><span class="metric-label">${label}</span><span class="no-check">不考核此项</span></div></div>`;
  const p=pct(act,tgt);
  const rem=remaining===null||remaining==='-'?null:parseFloat(remaining);
  return`<div class="${cls}"><div class="metric-header"><span class="metric-label">${label}</span><span><span class="metric-value" style="${valColor(p)}">${fmtNum(act)}</span><span class="metric-target"> / ${fmtNum(tgt)}${unit}</span></span></div><div class="progress-track"><div class="progress-bar ${barCls(p)}" style="width:${Math.min(100,Math.max(0,p))}%"></div></div><div class="metric-footer"><span>完成率 ${p}%</span>${rem!==null&&rem<=0?'<span class="done">✅ 已完成目标</span>':rem!==null?`<span>剩余：${fmtNum(rem)}${unit}</span>`:'<span>剩余：-</span>'}</div></div>`;
}
function showError(msg){document.getElementById('errorText').textContent=msg;document.getElementById('errorMsg').style.display='flex';}
function clearError(){document.getElementById('errorMsg').style.display='none';}

document.getElementById('sellerId').addEventListener('keydown',e=>{if(e.key==='Enter')search();});
document.getElementById('nickName').addEventListener('keydown',e=>{if(e.key==='Enter')search();});
</script>
