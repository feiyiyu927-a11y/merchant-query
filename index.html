.bar-green{background:#22c55e}

.bar-orange{background:#f97316}
.bar-red{background:#ef4444}
.metric-footer{display:flex;justify-content:space-between;font-size:12px;color:#8c8c8c}
.done{color:#16a34a;font-weight:500}
.tip{background:rgba(37,99,244,.05);border-radius:8px;padding:10px 14px;font-size:12px;color:#595959}

function getTagClass(isKey){
  if(!isKey) return 'tag-normal';
  if(isKey.includes('p0')) return 'tag-p0';
  if(isKey.includes('重点')) return 'tag-key';
  if(isKey.includes('荣誉')) return 'tag-honor';
  return 'tag-normal';
}

function fmtNum(v){
  if(v===null||v===undefined) return '-';
  const n = typeof v==='string' ? parseFloat(v) : v;
  if(isNaN(n)) return '-';
  const abs = Math.abs(n);
  return abs%1===0 ? String(n) : n.toFixed(1);
}

function pct(actual, target){
  if(target===null||target<=0) return 0;
  return Math.round((actual/target)*1000)/10;
}

function barClass(p){
  if(p>=100) return 'bar-green';
  if(p>=60) return 'bar-blue';
  if(p>=30) return 'bar-orange';
  return 'bar-red';
}

function valueColor(p){
  if(p>=100) return 'color:#16a34a';
  if(p>=60) return 'color:#2563f4';
  return 'color:#1a1a1a';
}

function renderMetric(label, unit, target, actual, remaining){
  const tgt = target==='-'||target===null ? null : parseFloat(target);
  const act = actual===null ? 0 : parseFloat(actual);
  
  // 不考核
  if(tgt===null||isNaN(tgt)){
    return `<div class="metric-item">
      <div class="metric-header">
        <span class="metric-label">${label}</span>
        <span class="no-check">不考核此项</span>
      </div>
    </div>`;
  }
  
  const p = pct(act, tgt);
  const barW = Math.min(100, Math.max(0, p));
  const rem = remaining===null||remaining==='-' ? null : parseFloat(remaining);
  
  return `<div class="metric-item">
    <div class="metric-header">
      <span class="metric-label">${label}</span>
      <span>
        <span class="metric-value" style="${valueColor(p)}">${fmtNum(act)}</span>
        <span class="metric-target"> / ${fmtNum(tgt)}${unit}</span>
      </span>
    </div>
    <div class="progress-track">
      <div class="progress-bar ${barClass(p)}" style="width:${barW}%"></div>
    </div>
    <div class="metric-footer">
      <span>完成率 ${p}%</span>
      ${rem!==null&&rem<=0 
        ? '<span class="done">✅ 已完成目标</span>' 
        : rem!==null 
          ? `<span>剩余：${fmtNum(rem)}${unit}</span>` 
          : '<span>剩余：-</span>'}
    </div>
  </div>`;
}

function search(){
  const input = document.getElementById('sellerId');
  const id = input.value.trim();
  
  // 清除错误
  document.getElementById('errorMsg').style.display='none';
  
  if(!id){
    showError('请输入卖家ID');
    return;
  }
  
  const m = MERCHANT_DATA[id];
  if(!m){
    showError(`未找到卖家ID「${id}」，请确认您输入的ID是否正确`);
    document.getElementById('result').innerHTML = '<div class="empty"><div>未找到该商家数据</div><div style="font-size:12px;margin-top:6px;color:#bfbfbf">请核对卖家ID后重试</div></div>';
    return;
  }
  
  // 渲染结果
  const metrics = [
    renderMetric('勤奋度（真人推流时长）','小时', m.ts, m.as, m.rs),
    renderMetric('原创挂车短视频发布数','条', m.tc, m.ac, m.rc),
    renderMetric('原创非挂车短视频发布数','条', m.tn, m.an, m.rn),
    renderMetric('商业化投流天数','天', m.ta, m.aa, m.ra),
  ].join('');
  
  document.getElementById('result').innerHTML = `
    <div class="card merchant-card">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px">
        <div style="flex:1;min-width:0">
          <span class="merchant-name">${m.n}</span>
          <span class="tag ${getTagClass(m.k)}">${m.k}</span>
          <div class="merchant-meta">卖家ID：${id} &nbsp;|&nbsp; 运营：${m.op}</div>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="metrics-title">考核期达标进度 <span style="font-size:12px;color:#8c8c8c;font-weight:400">（8.21-9.01实际 / 8.21-9.02目标）</span></div>
      ${metrics}
    </div>
    <div class="tip">💡 <b>说明：</b>实际达成数据截至 8.21-9.01，考核期结束时间为 9.02。负数/绿色表示已超额完成目标。</div>
  `;
}

function showError(msg){
  document.getElementById('errorText').textContent = msg;
  document.getElementById('errorMsg').style.display = 'flex';
}

function showAdminTip(){
  alert('运营更新数据步骤：\n1. 更新快手内部 Docs 表格\n2. 打开 DataAgent，发送：\n「请读取东北组考核表8.21-9.02 sheet最新数据，重新生成并发布商家自查页面」\n3. 等待约2-3分钟完成发布');
}

// 回车触发
document.getElementById('sellerId').addEventListener('keydown', function(e){
  if(e.key==='Enter') search();
});
