.metric-target{font-size:12px;color:#8c8c8c;font-weight:400}
.no-check{background:#f3f4f6;color:#6b7280;font-size:12px;padding:3px 10px;border-radius:12px;border:1px solid #e5e7eb}
.progress-track{height:8px;background:#f0f2f4;border-radius:99px;overflow:hidden;margin-bottom:6px}

.bar-green{background:#22c55e}

.bar-orange{background:#f97316}
.bar-red{background:#ef4444}
.metric-footer{display:flex;justify-content:space-between;font-size:12px;color:#8c8c8c}
.done{color:#16a34a;font-weight:500}
.divider{height:1px;background:#f0f2f4;margin:16px 0}
.tip{background:rgba(37,99,244,.05);border-radius:8px;padding:10px 14px;font-size:12px;color:#595959}

function fmtNum(v){
  if(v===null||v===undefined||v==='') return '-';
  const n=typeof v==='string'?parseFloat(v):v;
  if(isNaN(n)) return '-';
  return Math.abs(n)%1===0?String(n):n.toFixed(1);
}

function pct(actual,target){
  if(target===null||target<=0||actual===null) return 0;
  return Math.round((actual/target)*1000)/10;
}

function barClass(p){
  if(p>=100) return 'bar-green';
  if(p>=60) return 'bar-blue';
  if(p>=30) return 'bar-orange';
  return 'bar-red';
}

function valueColor(p){
  if(p>=100) return 'color:#16a34a';
  if(p>=60) return 'color:#2563f4';
  return 'color:#1a1a1a';
}

function renderMetric(label,unit,target,actual,remaining,isSum){
  const tgt=target==='-'||target===null?null:parseFloat(target);
  const act=actual===null||actual===undefined?0:parseFloat(actual);
  const itemClass=isSum?'metric-item metric-sum':'metric-item';
  
  if(tgt===null||isNaN(tgt)){
    return `<div class="${itemClass}">
      <div class="metric-header">
        <span class="metric-label">${label}</span>
        <span class="no-check">不考核此项</span>
      </div>
    </div>`;
  }
  
  const p=pct(act,tgt);
  const barW=Math.min(100,Math.max(0,p));
  const rem=remaining===null||remaining==='-'?null:parseFloat(remaining);
  
  return `<div class="${itemClass}">
    <div class="metric-header">
      <span class="metric-label">${label}</span>
      <span>
        <span class="metric-value" style="${valueColor(p)}">${fmtNum(act)}</span>
        <span class="metric-target"> / ${fmtNum(tgt)}${unit}</span>
      </span>
    </div>
    <div class="progress-track">
      <div class="progress-bar ${barClass(p)}" style="width:${barW}%"></div>
    </div>
    <div class="metric-footer">
      <span>完成率 ${p}%</span>
      ${rem!==null&&rem<=0
        ?'<span class="done">✅ 已完成目标</span>'
        :rem!==null
          ?`<span>剩余：${fmtNum(rem)}${unit}</span>`
          :'<span>剩余：-</span>'}
    </div>
  </div>`;
}

function search(){
  const input=document.getElementById('sellerId');
  const id=input.value.trim();
  document.getElementById('errorMsg').style.display='none';
  
  if(!id){showError('请输入卖家ID');return;}
  
  const m=MERCHANT_DATA[id];
  if(!m){
    showError(`未找到卖家ID「${id}」，请确认ID是否正确`);
    document.getElementById('result').innerHTML='<div class="empty"><div>未找到该商家数据</div><div style="font-size:12px;margin-top:6px;color:#bfbfbf">请核对卖家ID后重试</div></div>';
    return;
  }
  
  const metrics=[
    renderMetric('勤奋度（真人推流时长）','小时',m.ts,m.as,m.rs,false),
    '<div class="divider"></div>',
    renderMetric('原创挂车短视频发布数','条',m.tc,m.ac,m.rc,false),
    renderMetric('原创非挂车短视频发布数','条',m.tn,m.an,m.rn,false),
    renderMetric('📊 原创短视频发布数之和','条',m.tv,m.av,m.rv,true),
    '<div class="divider"></div>',
    renderMetric('商业化投流天数','天',m.ta,m.aa,m.ra,false),
  ].join('');
  
  document.getElementById('result').innerHTML=`
    <div class="card merchant-card">
      <div class="merchant-name">${m.n}</div>
      <div class="merchant-id">卖家ID：${id}</div>
    </div>
    <div class="card">
      <div class="metrics-title">
        考核期达标进度
        <span class="data-tag">实际截至 9.04-9.06</span>
      </div>
      ${metrics}
    </div>
    <div class="tip">💡 <b>说明：</b>实际数据截至 9.04-9.06，考核期为 9.04-9.16。视频之和为挂车+非挂车总数，负值表示已超额完成。</div>
  `;
}

function showError(msg){
  document.getElementById('errorText').textContent=msg;
  document.getElementById('errorMsg').style.display='flex';
}

document.getElementById('sellerId').addEventListener('keydown',e=>{if(e.key==='Enter')search();});
